<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:#0e1117; font-family: "Source Sans 3", "Source Sans Pro", sans-serif; }
    .wrap { width:100%; padding:0 0 4px 0; background:#0e1117; }
    .label-row { display: flex; align-items: center; gap: 4px; margin-bottom: 7px; }
    label { font-size: 14px; font-weight: 400; line-height: 1.25; }
    .help { cursor: help; opacity: .72; font-size: 12px; font-weight: 400; line-height: 1; border: 1px solid currentColor; width: 17px; height: 17px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; transform: translateY(-1px); }
    input {
      width: 100%; height: 40px; min-height: 40px; padding: 8px 12px;
      border: 1px solid rgba(250, 250, 250, 0.08); border-radius: 8px;
      background-color: rgb(38, 39, 48); color: rgb(250, 250, 250);
      font: inherit; font-size: 16px; outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:hover { border-color: rgba(250, 250, 250, 0.14); }
    input:focus { border-color: #ff4b4b; box-shadow: 0 0 0 1px #ff4b4b; }
    input.invalid { border-color: #ff4b4b; }
    .counter { text-align: right; margin-top: 2px; padding-right: 1px; font-size: 12px; line-height: 14px; opacity: .68; min-height: 14px; }
  </style>
</head>
<body style="background:#0e1117;">
  <div class="wrap">
    <div class="label-row">
      <label id="label" for="osInput"></label>
      <span id="help" class="help" title="">?</span>
    </div>
    <input id="osInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" />
    <div id="counter" class="counter"></div>
  </div>

<script>
  const input = document.getElementById('osInput');
  const label = document.getElementById('label');
  const help = document.getElementById('help');
  const counter = document.getElementById('counter');
  let maxDigits = 6;
  let lastSent = null;

  function send(type, payload = {}) {
    window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, '*');
  }

  function sanitize(raw) {
    return String(raw ?? '').replace(/\D/g, '').slice(0, maxDigits);
  }

  function refreshCounter() {
    counter.textContent = `${input.value.length}/${maxDigits}`;
    input.classList.toggle('invalid', input.value.length > 0 && input.value.length !== maxDigits);
  }

  function publish() {
    const clean = sanitize(input.value);
    if (input.value !== clean) input.value = clean;
    refreshCounter();
    if (clean !== lastSent) {
      lastSent = clean;
      send('streamlit:setComponentValue', { value: clean });
    }
  }

  input.addEventListener('input', publish);
  input.addEventListener('paste', () => setTimeout(publish, 0));

  window.addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.type !== 'streamlit:render') return;
    const args = data.args || {};
    maxDigits = Number(args.max_digits || 6);
    label.textContent = args.label || '';
    help.title = args.help_text || '';
    help.style.display = args.help_text ? 'inline-flex' : 'none';

    const incoming = sanitize(args.value || '');
    if (document.activeElement !== input && input.value !== incoming) {
      input.value = incoming;
      lastSent = incoming;
    }
    refreshCounter();
    send('streamlit:setFrameHeight', { height: 92 });
  });

  send('streamlit:componentReady', { apiVersion: 1 });
  send('streamlit:setFrameHeight', { height: 92 });
</script>
</body>
</html>
